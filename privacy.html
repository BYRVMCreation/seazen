<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Privacy Policy — SeaZen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400&family=Inter:wght@300;400&display=swap" rel="stylesheet">
<style>
  :root { --a:#66484e; --tx:#1c1916; --mid:#6d6260; --bg:#f5f5f5; --bdr:rgba(28,25,22,.1); }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Inter', sans-serif; font-weight: 300; font-size: 15px; line-height: 1.75; color: var(--tx); background: var(--bg); }
  .back-bar { position: sticky; top: 0; z-index: 100; background: rgba(245,245,245,.97); backdrop-filter: blur(10px); border-bottom: 1px solid var(--bdr); padding: 14px 48px; display: flex; justify-content: space-between; align-items: center; }
  .back-btn { display: inline-flex; align-items: center; gap: 8px; font-family: 'Inter', sans-serif; font-size: 12px; letter-spacing: .18em; text-transform: uppercase; color: var(--a); text-decoration: none; transition: gap .2s; }
  .back-btn:hover { gap: 12px; }
  .back-btn svg { width: 14px; height: 14px; }
  .lang-btn { background: none; border: 1px solid var(--bdr); color: var(--tx); font-family: 'Inter', sans-serif; font-size: 11px; letter-spacing: .1em; padding: 6px 12px; cursor: pointer; }
  .wrap { max-width: 720px; margin: 0 auto; padding: clamp(40px,6vw,80px) 24px clamp(60px,8vw,120px); }
  .ot { font-size: 9px; letter-spacing: .26em; text-transform: uppercase; color: var(--a); display: block; margin-bottom: 16px; }
  h1 { font-family: 'Cormorant Garamond', serif; font-weight: 300; font-size: clamp(32px,4vw,52px); line-height: 1.15; margin-bottom: 8px; }
  .updated { font-size: 12px; color: var(--mid); margin-bottom: 48px; }
  h2 { font-family: 'Cormorant Garamond', serif; font-weight: 400; font-size: 22px; margin: 40px 0 12px; }
  p { margin-bottom: 16px; color: var(--mid); white-space: pre-line; }
  a { color: var(--a); }
  hr { border: none; border-top: 1px solid var(--bdr); margin: 48px 0; }
  .footer-note { font-size: 12px; color: var(--mid); text-align: center; padding: 24px; border-top: 1px solid var(--bdr); }
  .footer-note a { color: var(--a); text-decoration: none; }
</style>
</head>
<body>
<div class="back-bar">
  <a class="back-btn" href="index.html">
    <svg fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path d="M19 12H5m0 0l7-7m-7 7l7 7"/></svg>
    <span id="back-text">Back to SeaZen</span>
  </a>
  <button id="lang-switch" class="lang-btn">ES</button>
</div>
<div class="wrap">
  <span id="page-ot" class="ot">Legal</span>
  <h1 id="page-title">Privacy Policy</h1>
  <p id="page-updated" class="updated">Last updated: 1 January 2026</p>
  <div id="page-content"></div>
</div>
<div class="footer-note">
  <span id="footer-copy">&copy; 2026 SeaZen. All rights reserved.</span>
  &nbsp;&middot;&nbsp;
  <a id="footer-terms" href="terms.html">Terms</a> &nbsp;&middot;&nbsp; <a id="footer-cancellation" href="cancellation.html">Cancellation</a>
</div>

<script>
var GOOGLE_TRANSLATE_API_KEY = 'AIzaSyCapYYpsJwrTjzqqjdjbJcDap5G7vWY9Nk';
var currentLang = localStorage.getItem('lang') || 'en';

async function translateWithGoogle(text) {
  if (!text || typeof text !== 'string') return text;
  try {
    var response = await fetch('https://translation.googleapis.com/language/translate/v2?key=' + GOOGLE_TRANSLATE_API_KEY, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ q: text, source: 'en', target: 'es', format: 'text' })
    });
    if (!response.ok) return text;
    var data = await response.json();
    return data.data.translations[0].translatedText;
  } catch (e) { return text; }
}

function renderContent(data) {
  document.getElementById('page-title').textContent = data.title;
  document.getElementById('page-updated').textContent = 'Last updated: ' + data.updated;
  
  var html = '';
  data.sections.forEach(function(section) {
    html += '<h2>' + section.heading + '</h2>';
    html += '<p>' + section.content + '</p>';
  });
  document.getElementById('page-content').innerHTML = html;
}

async function translatePage(data) {
  if (currentLang !== 'es') return;
  
  document.getElementById('back-text').textContent = await translateWithGoogle('Back to SeaZen');
  document.getElementById('page-ot').textContent = await translateWithGoogle('Legal');
  document.getElementById('page-title').textContent = await translateWithGoogle(data.title);
  document.getElementById('page-updated').textContent = await translateWithGoogle('Last updated: ' + data.updated);
  document.getElementById('footer-terms').textContent = 'Términos';
  document.getElementById('footer-cancellation').textContent = 'Cancelación';
  
  var sections = document.getElementById('page-content').querySelectorAll('h2, p');
  for (var i = 0; i < sections.length; i++) {
    sections[i].textContent = await translateWithGoogle(sections[i].textContent);
  }
}

function updateLangButton() {
  document.getElementById('lang-switch').textContent = currentLang === 'es' ? 'EN' : 'ES';
}

function toggleLanguage() {
  currentLang = currentLang === 'es' ? 'en' : 'es';
  localStorage.setItem('lang', currentLang);
  location.reload();
}

document.getElementById('lang-switch').addEventListener('click', toggleLanguage);

// Load content from CMS JSON
fetch('./privacy.json')
  .then(function(r) { return r.json(); })
  .then(function(data) {
    renderContent(data);
    if (currentLang === 'es') translatePage(data);
  })
  .catch(function() {});

// Load footer copy
fetch('./content.json')
  .then(function(r) { return r.json(); })
  .then(function(c) {
    if (c.footer && c.footer.copy) document.getElementById('footer-copy').textContent = c.footer.copy;
  })
  .catch(function() {});

updateLangButton();
</script>
</body>
</html>
